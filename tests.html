<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Pruebas del modelo</title>
<style>body{font-family:system-ui;max-width:900px;margin:1.5rem auto;padding:0 1rem}.ok{color:#1d7a55}.mal{color:#b3261e;font-weight:700}li{margin:.15rem 0}</style></head>
<body><h1>Pruebas del modelo (JavaScript)</h1><p id="resumen">Ejecutando…</p><ul id="lista"></ul>
<script src="js/config.js"></script><script src="js/datos.js"></script><script src="js/motor.js"></script>
<script>
const out = []; const cfg0 = () => JSON.parse(JSON.stringify(PAV.CONFIG_DEFECTO));
function t(nombre, f) { try { f(); out.push([nombre, true]); } catch (e) { out.push([nombre, false, e.message]); } }
function eq(a, b, m) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((m || "") + ` esperado ${JSON.stringify(b)}, obtenido ${JSON.stringify(a)}`); }
function cerca(a, b, tol, m) { if (!(Math.abs(a - b) <= tol)) throw new Error((m || "") + ` esperado ≈${b}, obtenido ${a}`); }
const via = (o) => Object.assign({ tipo: "arterial", trafico: "medio", esal: 3e6, drenaje: "regular", pendiente_pct: null, edad_anios: null, suelo: null, cbr_saturado: false,
  capas: { carpeta: { espesor: 10 }, base: { usa: true, espesor: 25, cbr: 80 }, subbase: { usa: true, espesor: 25, cbr: 40 }, mejoramiento: { usa: false, espesor: 30, cbr: 20 }, subrasante: { cbr: 8 } } }, o || {});

/* ---- lectura ---- */
t("TXT sin encabezado: centinela -99.9 → vacío", () => { const r = PAV.parseTexto("1963 3 1 20 -99.9 -99.9\n1963 3 2 5.3 15.2 -1.0\n"); eq(r.filas.length, 2); eq(Number.isNaN(r.filas[0].tmax), true); eq(r.filas[1].tmax, 15.2); eq(r.filas[0].pp, 20); });
t("CSV con encabezado, coma decimal y fecha dd/mm/aaaa", () => { const r = PAV.parseTexto("Fecha;Precipitación;TMAX;TMIN\n01/02/2020;1,5;12,0;-3,5\n02/02/2020;-99.9;11;-2\n"); eq(r.filas[0].t, Date.UTC(2020, 1, 1)); eq(r.filas[0].pp, 1.5); eq(Number.isNaN(r.filas[1].pp), true); eq(r.filas[0].tmin, -3.5); });
t("Duplicados: se conserva la última", () => { const r = PAV.parseTexto("2020 1 1 1 10 0\n2020 1 1 2 11 1\n2020 1 2 0 10 0\n"); eq(r.filas.length, 2); eq(r.filas[0].pp, 2); });
t("Serie diaria completa huecos de calendario", () => { const r = PAV.parseTexto("2020 1 1 1 10 0\n2020 1 4 0 10 0\n"); const S = PAV.serieDiaria(r.filas); eq(S.N, 4); eq(Number.isNaN(S.pp[1]), true); });

/* ---- indicadores ---- */
function mini(pp, tmin, tmax) { const n = pp.length; return PAV.serieDiaria(pp.map((p, i) => ({ t: Date.UTC(2020, 0, 1 + i), pp: p, tmax: tmax ? tmax[i] : 10, tmin: tmin ? tmin[i] : 5, caudal: NaN }))); }
t("Acumulados móviles y ventana incompleta", () => { const c = cfg0(); const b = PAV.baseDiaria(mini([10, 0, 5, 0, 0, 0, 0, 20, 0, 0]), c); eq(b.acum[3][2], 15); eq(b.acum[3][7], 20); eq(Number.isNaN(b.acum[3][0]), true); eq(b.acum[7][6], 15); });
t("Racha de lluvia con umbral 1 mm", () => { const b = PAV.baseDiaria(mini([0.5, 2, 3, 0, 1, 1.5, 4, 0]), cfg0()); eq(b.racha, [0, 1, 2, 0, 1, 2, 3, 0]); });
t("Heladas (Tmin ≤ 0) y ciclos (Tmin ≤ 0 y Tmax > 0)", () => { const b = PAV.baseDiaria(mini([0, 0, 0, 0, 0], [-2, -1, 3, 0, -5], [8, -1, 9, 4, 6]), cfg0()); eq(b.helada, [1, 1, 0, 1, 1]); eq(b.ciclo, [1, 0, 0, 1, 1]); });
t("Mes: totales, máximos y ciclos", () => { const c = cfg0(); const pp = Array(31).fill(0).concat([10, 30, 0, 0, 5], Array(24).fill(0)); const S = mini(pp, Array(60).fill(-3), Array(60).fill(8)); const m = PAV.indicadoresMensuales(PAV.baseDiaria(S, c), c); eq(m["2020-02"].pp_total, 45); eq(m["2020-02"].pp_max_24h, 30); eq(m["2020-02"].acum_3d, 40); eq(m["2020-01"].dias_helada, 31); eq(m["2020-02"].ciclos_hd, 29); eq(m["2020-02"].racha_lluvia, 2); });
t("Cobertura < 80 % anula el indicador (no se rellena)", () => { const c = cfg0(); const pp = Array(31).fill(1); for (let i = 3; i < 20; i++) pp[i] = NaN; const m = PAV.indicadoresMensuales(PAV.baseDiaria(mini(pp), c), c); eq(Number.isNaN(m["2020-01"].pp_total), true); });
t("Caudal: días sobre el umbral; sin caudal = vacío", () => { const c = cfg0(); c.indicadores.caudal_umbral_m3s = 10; const S = mini(Array(31).fill(0)); [1, 5, 12, 15, 9, 11].forEach((q, i) => (S.caudal[i] = q)); for (let i = 6; i < 31; i++) S.caudal[i] = 2; const m = PAV.indicadoresMensuales(PAV.baseDiaria(S, c), c); eq(m["2020-01"].dias_caudal_umbral, 3); eq(m["2020-01"].caudal_pico, 15); const m2 = PAV.indicadoresMensuales(PAV.baseDiaria(mini(Array(31).fill(0)), c), c); eq(Number.isNaN(m2["2020-01"].caudal_pico), true); });
t("Temporada dic–mar cruza fin de año", () => { eq(PAV.claveTemporada(Date.UTC(2020, 10, 30), 12, 3), null); eq(PAV.claveTemporada(Date.UTC(2020, 11, 1), 12, 3), "2020-21"); eq(PAV.claveTemporada(Date.UTC(2021, 2, 31), 12, 3), "2020-21"); eq(PAV.claveTemporada(Date.UTC(2021, 3, 1), 12, 3), null); });

/* ---- reglas ---- */
t("nivelCond con >=, <=, <, >", () => { const k = (op, v) => PAV.nivelCond(v, { operador: op, medio: 20, alto: 40 }); eq([k(">=", 19.9), k(">=", 20), k(">=", 40)], [0, 1, 2]); const j = (op, v) => PAV.nivelCond(v, { operador: op, medio: -5, alto: -10 }); eq([j("<=", -4), j("<=", -5), j("<=", -10)], [0, 1, 2]); eq([PAV.nivelCond(80, { operador: "<", medio: 80, alto: 50 }), PAV.nivelCond(79, { operador: "<", medio: 80, alto: 50 }), PAV.nivelCond(49, { operador: "<", medio: 80, alto: 50 })], [0, 1, 2]); eq(PAV.nivelCond(NaN, { medio: 1, alto: 2 }), null); });
t("Regla compuesta = mínimo (Y lógico); máximo entre reglas", () => { const reglas = [{ id: "A", descripcion: "", condiciones: [{ indicador: "x", medio: 10, alto: 20 }, { indicador: "y", medio: 3, alto: 6 }] }, { id: "B", descripcion: "", condiciones: [{ indicador: "z", medio: 5, alto: 9 }] }]; eq(PAV.nivelReglas({ x: 25, y: 0, z: 0 }, reglas).nivel, 0); eq(PAV.nivelReglas({ x: 25, y: 4, z: 0 }, reglas).nivel, 1); eq(PAV.nivelReglas({ x: 25, y: 7, z: 6 }, reglas).nivel, 2); eq(PAV.nivelReglas({ x: 25, y: 7, z: NaN }, reglas).nivel, 2); eq(PAV.nivelReglas({ x: NaN, y: 1, z: NaN }, reglas).nivel, null); });
t("Modificadores: suma limitada a ±1, sin dato = 0", () => { const c = cfg0(); eq(PAV.deltaModificadores({}, c, "baches").delta, 0); eq(PAV.deltaModificadores({ edad_anios: 15, drenaje: "deficiente", trafico: "alto" }, c, "baches").delta, 1); eq(PAV.deltaModificadores({ edad_anios: 1, drenaje: "bueno" }, c, "baches").delta, -1); eq(PAV.deltaModificadores({ drenaje: "deficiente" }, c, "ahuellamiento").delta, 0, "drenaje no aplica a ahuellamiento"); });

/* ---- estructura ---- */
t("SN requerido: la ecuación AASHTO-93 se cumple (ida y vuelta)", () => { const c = cfg0(), tp = c.tipos_via.arterial, esal = 3e6, mr = 9000; const sn = PAV.snRequerido(esal, mr, "arterial", c); const lw = tp.ZR * tp.S0 + 9.36 * Math.log10(sn + 1) - 0.2 + Math.log10((c.psi_inicial - tp.pt) / 2.7) / (0.4 + 1094 / Math.pow(sn + 1, 5.19)) + 2.32 * Math.log10(mr) - 8.07; cerca(lw, Math.log10(esal), 1e-6); });
t("SN requerido crece con el tráfico y baja con un suelo más rígido", () => { const c = cfg0(); const a = PAV.snRequerido(1e6, 9000, "arterial", c), b = PAV.snRequerido(1e7, 9000, "arterial", c), d = PAV.snRequerido(1e6, 20000, "arterial", c); if (!(b > a && d < a)) throw new Error(`${a} ${b} ${d}`); });
t("SN requerido: valores razonables (SN 2.5–6 para 1e6–2e7 ESAL, Mr 5000–15000 psi)", () => { const c = cfg0(); for (const e of [1e6, 5e6, 2e7]) for (const mr of [5000, 10000, 15000]) { const s = PAV.snRequerido(e, mr, "carretera", c); if (s < 1.5 || s > 7.5) throw new Error(`SN=${s} (esal ${e}, mr ${mr})`); } });
t("SN provisto (10 cm + 25 cm CBR80 + 25 cm CBR40, drenaje regular)", () => { const x = PAV.analizarEstructura(via(), cfg0()); cerca(x.sn_prov, 0.44 * 10 / 2.54 + 0.14 * 25 / 2.54 * 0.9 + 0.12 * 25 / 2.54 * 0.9, 1e-6); });
t("Interpolación de coeficientes de capa (CBR 50 → entre 0.12 y 0.13)", () => { const a = PAV.interp(cfg0().estructura.coef_base_por_cbr, 50); cerca(a, 0.125, 1e-9); });
t("CBR equivalente con mejoramiento (cubo de la raíz cúbica)", () => { cerca(PAV.cbrEquivalente(20, 60, 5, 60), 20, 1e-9); cerca(PAV.cbrEquivalente(20, 0, 5, 60), 5, 1e-9); const x = PAV.cbrEquivalente(20, 30, 5, 60); if (!(x > 5 && x < 20)) throw new Error(x); });
t("Vulnerabilidad de capas: base CBR 80 = Bajo; CBR 79 = Medio; subrasante CBR 4 = Alto", () => { eq(PAV.analizarEstructura(via(), cfg0()).vuln.base.nivel, 0); const v2 = via(); v2.capas.base.cbr = 79; eq(PAV.analizarEstructura(v2, cfg0()).vuln.base.nivel, 1); const v3 = via(); v3.capas.subrasante.cbr = 4; eq(PAV.analizarEstructura(v3, cfg0()).vuln.subrasante.nivel, 2); });
t("Sin capas granulares: la subrasante sube de vulnerabilidad por falta de cobertura", () => { const v = via(); v.capas.base.usa = false; v.capas.subbase.usa = false; const x = PAV.analizarEstructura(v, cfg0()); eq(x.vuln.subrasante.nivel, 2); eq(x.presentes, ["carpeta", "subrasante"]); });
t("Mayor humedad → menor razón R (estructura más débil)", () => { const c = cfg0(), x = PAV.analizarEstructura(via(), c); const r0 = PAV.estructuralMes(x, 0, c).R, r2 = PAV.estructuralMes(x, 2, c).R; if (!(r2 < r0)) throw new Error(`${r0} ${r2}`); });
t("CBR saturado reduce la pérdida adicional", () => { const c = cfg0(), x1 = PAV.analizarEstructura(via(), c), x2 = PAV.analizarEstructura(via({ cbr_saturado: true }), c); if (!(PAV.estructuralMes(x2, 2, c).perdida < PAV.estructuralMes(x1, 2, c).perdida)) throw new Error("no reduce"); });

/* ---- capa crítica ---- */
t("Capa crítica: subrasante débil + humedad alta → piel de cocodrilo en subrasante", () => { const c = cfg0(), v = via(); v.capas.subrasante.cbr = 3; const x = PAV.analizarEstructura(v, c); const ind = { acum_30d: 300, dias_lluvia: 26, racha_lluvia: 20, acum_3d: 10, pp_max_24h: 5, acum_7d: 20, acum_15d: 100, ciclos_hd: 0, dias_helada: 0, tmin_min: 3, tmax_max: 20, caudal_pico: NaN, dias_caudal_umbral: NaN }; const r = PAV.evaluarMes(ind, x, c); eq(r.fallas.piel_cocodrilo.nivel, 2); eq(r.fallas.piel_cocodrilo.capa, "subrasante"); });
t("Capa crítica: base débil (CBR 45) con lluvia intensa → bache en la base", () => { const c = cfg0(), v = via(); v.capas.base.cbr = 45; const x = PAV.analizarEstructura(v, c); const ind = { acum_30d: 100, dias_lluvia: 10, racha_lluvia: 3, acum_3d: 80, pp_max_24h: 45, acum_7d: 100, acum_15d: 100, ciclos_hd: 0, dias_helada: 0, tmin_min: 3, tmax_max: 20, caudal_pico: NaN, dias_caudal_umbral: NaN }; const r = PAV.evaluarMes(ind, x, c); eq(r.fallas.baches.capa, "base"); eq(r.fallas.baches.nivel >= 1, true); });
t("Frío extremo → fisura transversal en la carpeta; mes seco sin amenazas → Bajo", () => { const c = cfg0(), x = PAV.analizarEstructura(via(), c); const ind = { acum_30d: 0, dias_lluvia: 0, racha_lluvia: 0, acum_3d: 0, pp_max_24h: 0, acum_7d: 0, acum_15d: 0, ciclos_hd: 0, dias_helada: 0, tmin_min: -13, tmax_max: 18, caudal_pico: NaN, dias_caudal_umbral: NaN }; const r = PAV.evaluarMes(ind, x, c); eq(r.fallas.fisura_transversal.capa, "carpeta"); eq(r.fallas.fisura_transversal.nivel >= 1, true); eq(r.fallas.baches.nivel, 0); });
t("Mes con datos insuficientes → Sin datos para fallas climáticas", () => { const c = cfg0(), x = PAV.analizarEstructura(via(), c); const r = PAV.evaluarMes({}, x, c); eq(r.fallas.baches.nivel, null); });
t("La estructura no crea riesgo si no hay amenaza ni deficiencia (R ≥ 1)", () => { const c = cfg0(), v = via({ esal: 1e5 }); v.capas.subrasante.cbr = 20; const x = PAV.analizarEstructura(v, c); const ind = { acum_30d: 0, dias_lluvia: 0, racha_lluvia: 0, acum_3d: 0, pp_max_24h: 0, acum_7d: 0, acum_15d: 0, ciclos_hd: 0, dias_helada: 0, tmin_min: 3, tmax_max: 20, caudal_pico: NaN, dias_caudal_umbral: NaN }; const r = PAV.evaluarMes(ind, x, c); eq(Object.values(r.fallas).map((f) => f.nivel), [0, 0, 0, 0, 0, 0]); });

/* ---- mantenimiento ---- */
function resFalso(porMes) { const o = {}; for (const [k, v] of Object.entries(porMes)) { o[k] = { amenazas: v.am || {}, fallas: {} }; for (const f of ["piel_cocodrilo", "ahuellamiento", "fisura_longitudinal", "fisura_transversal", "baches", "desprendimiento"]) o[k].fallas[f] = { fid: f, nombre: f, nivel: (v.n && v.n[f] !== undefined) ? v.n[f] : 0, capa: (v.c && v.c[f]) || "carpeta" }; } return o; }
t("Mantenimiento: sin riesgo → solo monitoreo", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const m = PAV.mantenimiento(resFalso({ "2020-01": {}, "2020-02": {} }), x, c); eq(m.tipica, "ninguno"); });
t("Mantenimiento: un mes Medio → rutinario", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const m = PAV.mantenimiento(resFalso({ "2020-01": { n: { baches: 1 } }, "2020-02": {} }), x, c); eq(m.tipica, "rutinario"); });
t("Mantenimiento: 2 meses Alto superficial → periódico", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const m = PAV.mantenimiento(resFalso({ "2020-01": { n: { fisura_transversal: 2 } }, "2020-02": { n: { desprendimiento: 2 } }, "2020-03": {} }), x, c); eq(m.tipica, "periodico"); });
t("Mantenimiento: 3 meses Alto estructural en capa inferior → rehabilitación", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const n = { n: { piel_cocodrilo: 2 }, c: { piel_cocodrilo: "subrasante" } }; const m = PAV.mantenimiento(resFalso({ "2020-01": n, "2020-02": n, "2020-03": n }), x, c); eq(m.tipica, "rehabilitacion"); });
t("Mantenimiento: Alto estructural en la carpeta no obliga a rehabilitar", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const n = { n: { piel_cocodrilo: 2 }, c: { piel_cocodrilo: "carpeta" } }; const m = PAV.mantenimiento(resFalso({ "2020-01": n, "2020-02": n, "2020-03": n }), x, c); eq(m.tipica === "rehabilitacion", false); });
t("Mantenimiento: capacidad estructural insuficiente (R < 0.85) → rehabilitación", () => { const c = cfg0(), v = via({ esal: 5e7 }); v.capas.subrasante.cbr = 3; const x = PAV.analizarEstructura(v, c); if (!(x.razonSeco < 0.85)) throw new Error("R=" + x.razonSeco); const m = PAV.mantenimiento(resFalso({ "2020-01": {} }), x, c); eq(m.tipica, "rehabilitacion"); });
t("Mantenimiento: crecida Alto → emergencia; lluvia intensa → vigilancia diaria", () => { const c = cfg0(), x = PAV.analizarEstructura(via({ esal: 1e5 }), c); const m = PAV.mantenimiento(resFalso({ "2020-01": { am: { crecida: 2, lluvia_intensa: 1 } }, "2021-01": { am: { lluvia_intensa: 1 } } }), x, c); eq(m.emergencia, true); eq(m.diaria, true); });

/* ---- validación ---- */
t("Validación: aciertos, falsos positivos/negativos y matriz", () => { const res = { "2020-01": { fallas: { baches: { nivel: 2 } } }, "2020-02": { fallas: { baches: { nivel: 1 } } }, "2020-03": { fallas: { baches: { nivel: 0 } } }, "2020-04": { fallas: { baches: { nivel: 0 } } } }; const obs = PAV.parseObservadas("periodo,baches\n2020-01,1\n2020-02,0\n2020-03,1\n2020-04,0\n"); const m = PAV.validar(res, obs, 1); eq([m.baches.VP, m.baches.FP, m.baches.FN, m.baches.VN], [1, 1, 1, 1]); eq(m.baches.exactitud, 0.5); const m2 = PAV.validar(res, obs, 2); eq(m2.GLOBAL.FP, 0); });
t("Validación: formato largo", () => { const o = PAV.parseObservadas("periodo,tipo_falla,observada\n2020-01,baches,1\n"); eq(o, [{ periodo: "2020-01", falla: "baches", obs: 1 }]); });

const bien = out.filter((o) => o[1]).length;
document.getElementById("resumen").innerHTML = `<b class="${bien === out.length ? "ok" : "mal"}">${bien} de ${out.length} pruebas pasaron.</b>`;
document.getElementById("lista").innerHTML = out.map(([n, ok, m]) => `<li class="${ok ? "ok" : "mal"}">${ok ? "✔" : "✘"} ${n}${m ? " — " + m : ""}</li>`).join("");
window.TEST_RESULT = { total: out.length, ok: bien, fallos: out.filter((o) => !o[1]) };
</script></body></html>
